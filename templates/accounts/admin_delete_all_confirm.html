{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4><i class="fas fa-exclamation-triangle"></i> Delete ALL Groups?</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-danger">
                    <h5><i class="fas fa-skull"></i> WARNING!</h5>
                    <p>You are about to delete <strong>ALL groups</strong> and all their members.</p>
                    <p>This action <strong>CANNOT</strong> be undone easily.</p>
                </div>
                <p>Are you absolutely sure you want to proceed?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash-alt"></i> Yes, Delete All Groups
                        </button>
                        <a href="{% url 'accounts:admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
